services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongo:27017/clinica_vida_plena
      PORT: 3000
      TZ: America/Sao_Paulo
      DATA_DIR: /app/data
    ports: ["3000:3000"]
    volumes: [./data:/app/data:ro]
    depends_on:
      mongo: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  mongo_data:
